{% extends 'base.html' %}

{% block content %}
    <div class="form-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="form-flash-messages">
                    {% for category, message in messages %}
                        <div class="form-flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <h2>登录</h2>
        <form method="POST">
            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" name="username" required placeholder="请输入邮箱地址" value="{{ request.form.get('username', '') }}">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required placeholder="请输入密码">
            </div>
            <div style="text-align: right; margin-bottom: 1.25rem;">
                <a href="{{ url_for('forgot_password') }}" style="font-size: 0.85rem; color: var(--primary-color); text-decoration: none;">忘记密码？</a>
            </div>
            <button type="submit" class="btn">登录</button>
        </form>
        <p style="margin-top: 1rem; text-align: center;">
            还没有账号？<a href="{{ url_for('register') }}">立即注册</a>
        </p>
    </div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
    <div class="form-container">
        <h2>上传图片</h2>
        <form method="POST" enctype="multipart/form-data" id="image-upload-form">
            <div class="form-group">
                <label for="files">选择图片（可多选）</label>
                <input type="file" id="files" name="files" accept="image/*" required multiple onchange="previewImages(event)">
                <p style="font-size: 0.85rem; color: var(--text-light); margin-top: 0.5rem;">支持 JPG、PNG、GIF 格式</p>
            </div>
            
            <div id="preview-container" style="margin-bottom: 1.5rem; min-height: 100px;">
                <div id="preview-empty" style="text-align: center; color: var(--text-light); padding: 2rem; border: 2px dashed var(--border-color); border-radius: 10px;">
                    点击上方选择图片，或拖拽图片到此处
                </div>
                <div id="preview-images" style="display: none; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.75rem;"></div>
            </div>
            
            <div class="form-group">
                <label for="caption">图片说明（可选，所有图片共用）</label>
                <textarea id="caption" name="caption" rows="4" placeholder="为所有图片添加共同说明，可以换行输入" style="resize: vertical;"></textarea>
            </div>
            
            <button type="submit" class="btn">上传</button>
            <a href="{{ url_for('admin') }}" class="btn btn-secondary" style="margin-left: 0.5rem;">取消</a>
        </form>
    </div>

    <script>
        const selectedFiles = [];
        
        function previewImages(event) {
            const files = event.target.files;
            const previewContainer = document.getElementById('preview-container');
            const previewEmpty = document.getElementById('preview-empty');
            const previewImages = document.getElementById('preview-images');
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (file && file.type.startsWith('image/')) {
                    selectedFiles.push(file);
                }
            }
            
            renderPreviews();
        }
        
        function renderPreviews() {
            const previewEmpty = document.getElementById('preview-empty');
            const previewImages = document.getElementById('preview-images');
            
            if (selectedFiles.length > 0) {
                previewEmpty.style.display = 'none';
                previewImages.style.display = 'grid';
                previewImages.innerHTML = '';
                
                selectedFiles.forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const imageWrapper = document.createElement('div');
                        imageWrapper.style.position = 'relative';
                        imageWrapper.style.borderRadius = '8px';
                        imageWrapper.style.overflow = 'hidden';
                        imageWrapper.style.boxShadow = '0 2px 8px rgba(0, 0, 0, 0.1)';
                        
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.style.width = '100%';
                        img.style.height = '100px';
                        img.style.objectFit = 'cover';
                        
                        const deleteBtn = document.createElement('button');
                        deleteBtn.innerHTML = '×';
                        deleteBtn.style.position = 'absolute';
                        deleteBtn.style.top = '4px';
                        deleteBtn.style.right = '4px';
                        deleteBtn.style.width = '24px';
                        deleteBtn.style.height = '24px';
                        deleteBtn.style.border = 'none';
                        deleteBtn.style.borderRadius = '50%';
                        deleteBtn.style.background = 'rgba(0, 0, 0, 0.6)';
                        deleteBtn.style.color = '#fff';
                        deleteBtn.style.fontSize = '16px';
                        deleteBtn.style.cursor = 'pointer';
                        deleteBtn.style.display = 'flex';
                        deleteBtn.style.alignItems = 'center';
                        deleteBtn.style.justifyContent = 'center';
                        deleteBtn.onclick = function() {
                            selectedFiles.splice(index, 1);
                            renderPreviews();
                            updateHiddenInput();
                        };
                        
                        imageWrapper.appendChild(img);
                        imageWrapper.appendChild(deleteBtn);
                        previewImages.appendChild(imageWrapper);
                    };
                    reader.readAsDataURL(file);
                });
                
                updateHiddenInput();
            } else {
                previewEmpty.style.display = 'block';
                previewImages.style.display = 'none';
            }
        }
        
        function updateHiddenInput() {
            const form = document.getElementById('image-upload-form');
            let hiddenInput = document.getElementById('selected-files-count');
            if (!hiddenInput) {
                hiddenInput = document.createElement('input');
                hiddenInput.type = 'hidden';
                hiddenInput.id = 'selected-files-count';
                hiddenInput.name = 'selected_count';
                form.appendChild(hiddenInput);
            }
            hiddenInput.value = selectedFiles.length;
        }
        
        document.getElementById('image-upload-form').addEventListener('submit', function(e) {
            const dataTransfer = new DataTransfer();
            selectedFiles.forEach(file => {
                dataTransfer.items.add(file);
            });
            document.getElementById('files').files = dataTransfer.files;
        });
    </script>
{% endblock %}

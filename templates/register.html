{% extends 'base.html' %}

{% block content %}
    <div class="form-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="form-flash-messages">
                    {% for category, message in messages %}
                        <div class="form-flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <h2>注册</h2>
        <form method="POST" id="register-form">
            <div class="form-group">
                <label for="nickname">昵称 <span style="color: #dc3545;">*</span></label>
                <input type="text" id="nickname" name="nickname" required placeholder="请输入昵称" value="{{ request.form.get('nickname', '') }}">
            </div>
            <div class="form-group">
                <label for="email">邮箱 <span style="color: #dc3545;">*</span></label>
                <input type="email" id="email" name="email" required placeholder="请输入邮箱地址" value="{{ request.form.get('email', '') }}">
            </div>
            <div class="form-group">
                <label for="password">密码 <span style="color: #dc3545;">*</span></label>
                <input type="password" id="password" name="password" required placeholder="4-20位字母或数字">
                <span style="font-size: 0.8rem; color: var(--text-light);">密码长度4-20位，仅限字母和数字</span>
            </div>
            <div class="form-group">
                <label for="password_confirm">确认密码 <span style="color: #dc3545;">*</span></label>
                <input type="password" id="password_confirm" name="password_confirm" required placeholder="请再次输入密码">
            </div>
            <div class="form-group">
                <label for="verification_code">验证码 <span style="color: #dc3545;">*</span></label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="verification_code" name="verification_code" required placeholder="请输入验证码" value="{{ request.form.get('verification_code', '') }}">
                    <button type="button" class="btn btn-secondary" id="send-code-btn" style="white-space: nowrap;">获取验证码</button>
                </div>
            </div>
            <button type="submit" class="btn">注册</button>
        </form>
        <p style="margin-top: 1rem; text-align: center;">
            已有账号？<a href="{{ url_for('login') }}">立即登录</a>
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sendBtn = document.getElementById('send-code-btn');
            const nicknameInput = document.getElementById('nickname');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const passwordConfirmInput = document.getElementById('password_confirm');
            
            // 密码验证：4-20位字母或数字
            const passwordRegex = /^[a-zA-Z0-9]{4,20}$/;
            
            sendBtn.addEventListener('click', function() {
                // 验证昵称
                const nickname = nicknameInput.value.trim();
                if (!nickname) {
                    alert('请输入昵称');
                    nicknameInput.focus();
                    return;
                }
                
                // 验证邮箱
                const email = emailInput.value.trim();
                if (!email) {
                    alert('请输入邮箱地址');
                    emailInput.focus();
                    return;
                }
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    alert('请输入有效的邮箱地址');
                    emailInput.focus();
                    return;
                }
                
                // 验证密码
                const password = passwordInput.value;
                if (!password) {
                    alert('请输入密码');
                    passwordInput.focus();
                    return;
                }
                if (!passwordRegex.test(password)) {
                    alert('密码长度需4-20位，仅限字母和数字');
                    passwordInput.focus();
                    return;
                }
                
                // 验证确认密码
                const passwordConfirm = passwordConfirmInput.value;
                if (!passwordConfirm) {
                    alert('请输入确认密码');
                    passwordConfirmInput.focus();
                    return;
                }
                if (password !== passwordConfirm) {
                    alert('两次输入的密码不一致');
                    passwordConfirmInput.focus();
                    return;
                }
                
                sendBtn.disabled = true;
                sendBtn.textContent = '发送中...';
                
                fetch('/send_verification_code', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-CSRFToken': window.getCsrfToken ? window.getCsrfToken() : '',
                    },
                    body: 'email=' + encodeURIComponent(email)
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert(data.message);
                        let countdown = 60;
                        sendBtn.textContent = countdown + '秒后重试';
                        const timer = setInterval(() => {
                            countdown--;
                            if (countdown <= 0) {
                                clearInterval(timer);
                                sendBtn.disabled = false;
                                sendBtn.textContent = '获取验证码';
                            } else {
                                sendBtn.textContent = countdown + '秒后重试';
                            }
                        }, 1000);
                    } else {
                        alert(data.message);
                        sendBtn.disabled = false;
                        sendBtn.textContent = '获取验证码';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('发送失败，请稍后重试');
                    sendBtn.disabled = false;
                    sendBtn.textContent = '获取验证码';
                });
            });
        });
    </script>
{% endblock %}
